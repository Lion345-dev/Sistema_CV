anecdotes:
- id: anecdote_dual_degree_balance
  text_es: He pasado los últimos años equilibrando un programa de doble titulación exigente con un trabajo
    de tiempo completo.
  text_en: I've spent the last few years balancing a demanding dual-degree program with full-time work.
  tags: []
- id: anecdote_reconciliation_enjoyment
  text_es: En CAVII llevo las conciliaciones bancarias mensuales y ayudo a preparar reportes financieros,
    y la parte que más disfruto es justamente la conciliación en sí — detectar la pequeña discrepancia
    antes de que se convierta en un problema real.
  text_en: At CAVII I handle monthly bank reconciliations and help prepare financial reports, and honestly,
    the part of that job I've come to enjoy most is the reconciliation work itself — catching the small
    discrepancy before it becomes a real problem.
  tags:
  - reconciliation
  - financial-reporting
  - regulatory
- id: anecdote_coparmex_crisis_management
  text_es: Antes coordiné eventos para COPARMEX, lo cual significaba gestionar a cinco personas y resolver
    lo que fuera saliendo mal en tiempo real, casi siempre con no más de quince minutos para resolverlo.
  text_en: Before that, I coordinated events for COPARMEX, which meant managing five people and fixing
    whatever went wrong in real time, usually with no more than fifteen minutes to figure it out.
  tags:
  - leadership
  - coordination
  - problem-solving
- id: anecdote_international_regulatory_interest
  text_es: Lo que me atrae de este tipo de puesto es el lado internacional — comparar cómo otros países
    estructuran sus esquemas de seguro de depósitos y resolución bancaria, y evaluar qué vale la pena
    adaptar aquí.
  text_en: What draws me to this kind of role is the international side of it — comparing how other countries
    structure deposit insurance and bank resolution, and figuring out what's worth adapting here.
  tags:
  - policy
  - regulatory
- id: anecdote_autoinvest_pro_motivation
  text_es: Fuera del horario de oficina he construido AutoInvest Pro, una plataforma propia en Python
    para automatizar decisiones de inversión, ya con doce módulos completados — no por un curso, sino
    porque los mercados son el tema al que naturalmente regreso.
  text_en: On my own time I've been building AutoInvest Pro, a Python-based investment automation platform,
    twelve modules in — not for a class, but because markets are the subject I naturally keep coming back
    to.
  tags:
  - markets
  - investment
  - quant
