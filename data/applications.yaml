    Produce competitive and profitable pricing proposals. Collaborate with Sales and Product teams to
    enhance pricing models and tools through process improvement and effective controls. Conduct process
    realignments, identify and fix revenue leaks, sensitivity analyses, scenario planning, negotiation
    strategies. Design and create MIS for reporting to senior stakeholders. Leverage data analytics to
    enhance price modelling, support pricing strategy and repricing events. Support implementation of
    AI solutions applied to revenue management and pricing processes.


    Required Qualifications: Degree in finance and/or quantitative disciplines. Experience in financial
    analysis with strong preference for pricing-related experience and pricing techniques. Familiarity
    with the payments industry. Ability to apply financial forensic techniques, identify and resolve data
    inconsistencies. Strong interpersonal and communication skills, executive presence.


