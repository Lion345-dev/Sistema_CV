  company: IGNIA Partners
  role_title: Investment Intern
  posting_text: 'IGNIA Investment Intern Position - July 2026

    INDUSTRY: Venture Capital

    LOCATION: Mexico City

    COMPANY: IGNIA Partners

    ABOUT US: IGNIA is a cross-border venture capital firm investing in high-growth tech ventures tackling
    pain points faced by the emerging middle class in Latin America. We empower both Latin American companies
    and global businesses expanding into the region. Our team understands the needs of consumers and SMEs,
    market dynamics, trends and regulatory implications, and is positioned to capitalize investment opportunities
    in industries such as fintech, SaaS, digital marketplaces, e-commerce, and collaborative economies.

    RESPONSIBILITIES: Assist the fund''s Investment Team in the evaluation of investments (business plan
    screening, deck reviews, field analysis, financial modeling, valuations). Develop presentations, reports,
    and conduct independent analysis relating to potential new investments. Interface regularly with IGNIA''s
    Investment Team on both broad investment and company specific topics. Extend the firm''s reach and
    reputation through targeted outreach initiatives.

    QUALIFICATIONS: Strong organizational, quantitative, and analytical skills, detail-oriented and ability
    to multi-task. Understanding of financial reports, financial analysis, accounting techniques and valuations.
    Exceptional knowledge of, and experience with Microsoft Excel and PowerPoint. Demonstrated interest
    in Latin America and commitment to social change through innovation and entrepreneurship. Ability
    to manage independently projects and meet deadlines. High degree of professionalism with superior
    written and verbal communication skills. Fluency in Spanish and English required. Interest in investment
    banking, corporate finance, equity research, management consulting, private equity or venture capital
    will be a plus. We seek candidates with academic backgrounds in business, economics, or engineering.
    Applicants must have either completed their undergraduate degree or be in the final semesters of their
    studies.'
